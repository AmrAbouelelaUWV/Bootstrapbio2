name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for the bootstrap resources
        required: false
        default: ''
        type: string
      resourceGroupName:
        description: Resource group for the Terraform backend
        required: false
        default: ''
        type: string
      storageAccountName:
        description: Exact storage account name for Terraform state. Overrides discovery and prefix generation.
        required: false
        default: ''
        type: string
      storageAccountPrefix:
        description: Storage account prefix for Terraform state
        required: false
        default: ''
        type: string
      containerName:
        description: Blob container for Terraform state
        required: false
        default: tfstate
        type: string
      stateKey:
        description: Blob key for Terraform state
        required: false
        default: bootstrap.tfstate
        type: string
      publicNetworkAccessEnabled:
        description: Keep public network access enabled for the backend storage account.
        required: false
        default: false
        type: boolean
      networkRulesEnabled:
        description: Enable deny-by-default storage firewall rules.
        required: false
        default: true
        type: boolean
      privateEndpointEnabled:
        description: Create a private endpoint and private DNS for the blob service.
        required: false
        default: true
        type: boolean
      privateEndpointSubnetId:
        description: Subnet ID for the storage private endpoint.
        required: false
        default: ''
        type: string
      lastAccessTimeEnabled:
        description: Enable blob last access time tracking.
        required: false
        default: true
        type: boolean
      blobDeleteRetentionDays:
        description: Deleted blob retention in days.
        required: false
        default: '30'
        type: string
      containerDeleteRetentionDays:
        description: Deleted container retention in days.
        required: false
        default: '30'
        type: string
      cmkEnabled:
        description: Enable customer-managed key encryption for the state storage account.
        required: false
        default: true
        type: boolean
      cmkKeyVaultId:
        description: Resource ID of the Key Vault that contains the CMK.
        required: false
        default: ''
        type: string
      cmkKeyVaultName:
        description: Key Vault name used to resolve cmkKeyVaultId automatically when ID is not provided.
        required: false
        default: kv-bootstrap-cmk
        type: string
      cmkKeyName:
        description: Key name in Key Vault used as CMK for state storage.
        required: false
        default: tfstate-cmk-key
        type: string
      cmkKeyVersion:
        description: Optional key version in Key Vault.
        required: false
        default: ''
        type: string
      cmkUserAssignedIdentityId:
        description: Optional existing user-assigned identity ID for CMK access.
        required: false
        default: ''
        type: string
      cmkUserAssignedIdentityName:
        description: Name for the CMK user-assigned identity when the module creates it.
        required: false
        default: tfstate-cmk-uai
        type: string
      selfHostedRunnerEnabled:
        description: Provision and register an ephemeral self-hosted runner via Azure Container Apps Job.
        required: false
        default: false
        type: boolean
      selfHostedRunnerImage:
        description: Container image used for the ephemeral self-hosted runner job.
        required: false
        default: ubuntu:22.04
        type: string
      selfHostedRunnerLabel:
        description: GitHub runner label used by the verification job.
        required: false
        default: bio2-runner
        type: string

jobs:
  bootstrap:
    name: Seed backend, import resources, and apply
    runs-on: ubuntu-latest
    environment: Development

    permissions:
      id-token: write
      contents: read

    env:
      BOOTSTRAP_DIR: layers/bootstrap
      LOCATION: ${{ inputs.location }}
      RESOURCE_GROUP_NAME: ${{ inputs.resourceGroupName }}
      RESOURCE_GROUP_NAME_SECRET: ${{ secrets.STATE_RG_NAME }}
      STORAGE_ACCOUNT_NAME: ${{ inputs.storageAccountName }}
      STORAGE_ACCOUNT_NAME_SECRET: ${{ secrets.STATE_SA_NAME }}
      STORAGE_ACCOUNT_PREFIX: ${{ inputs.storageAccountPrefix }}
      STORAGE_ACCOUNT_PREFIX_SECRET: ${{ secrets.STATE_SA_PREFIX }}
      LOCATION_SECRET: ${{ secrets.STATE_LOCATION }}
      CONTAINER_NAME: ${{ inputs.containerName }}
      STATE_KEY: ${{ inputs.stateKey }}
      PUBLIC_NETWORK_ACCESS_ENABLED: ${{ inputs.publicNetworkAccessEnabled }}
      NETWORK_RULES_ENABLED: ${{ inputs.networkRulesEnabled }}
      NETWORK_BYPASS: '[]'
      ALLOWED_SUBNET_IDS: '[]'
      ALLOWED_IP_RULES: '[]'
      PRIVATE_ENDPOINT_ENABLED: ${{ inputs.privateEndpointEnabled }}
      PRIVATE_ENDPOINT_SUBNET_ID: ${{ inputs.privateEndpointSubnetId }}
      PRIVATE_DNS_ZONE_NAME: privatelink.blob.core.windows.net
      PRIVATE_DNS_ZONE_RESOURCE_GROUP_NAME: ''
      PRIVATE_DNS_ZONE_VIRTUAL_NETWORK_ID: ''
      BLOB_VERSIONING_ENABLED: true
      CHANGE_FEED_ENABLED: true
      LAST_ACCESS_TIME_ENABLED: ${{ inputs.lastAccessTimeEnabled }}
      BLOB_DELETE_RETENTION_DAYS: ${{ inputs.blobDeleteRetentionDays }}
      CONTAINER_DELETE_RETENTION_DAYS: ${{ inputs.containerDeleteRetentionDays }}
      CMK_ENABLED: ${{ inputs.cmkEnabled }}
      CMK_KEY_VAULT_ID: ${{ inputs.cmkKeyVaultId }}
      CMK_KEY_VAULT_NAME: ${{ inputs.cmkKeyVaultName }}
      CMK_KEY_VAULT_NAME_SECRET: ${{ secrets.CMK_KEY_VAULT_NAME }}
      CMK_KEY_NAME: ${{ inputs.cmkKeyName }}
      CMK_KEY_VERSION: ${{ inputs.cmkKeyVersion }}
      CMK_USER_ASSIGNED_IDENTITY_ID: ${{ inputs.cmkUserAssignedIdentityId }}
      CMK_USER_ASSIGNED_IDENTITY_NAME: ${{ inputs.cmkUserAssignedIdentityName }}
      SELF_HOSTED_RUNNER_ENABLED: ${{ inputs.selfHostedRunnerEnabled }}
      SELF_HOSTED_RUNNER_IMAGE: ${{ inputs.selfHostedRunnerImage }}
      SELF_HOSTED_RUNNER_LABEL: ${{ inputs.selfHostedRunnerLabel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep bootstrap
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"

          requested_location="${LOCATION:-$LOCATION_SECRET}"
          resource_group_name="${RESOURCE_GROUP_NAME:-$RESOURCE_GROUP_NAME_SECRET}"
          storage_account_name="${STORAGE_ACCOUNT_NAME:-$STORAGE_ACCOUNT_NAME_SECRET}"
          storage_account_prefix="${STORAGE_ACCOUNT_PREFIX:-$STORAGE_ACCOUNT_PREFIX_SECRET}"

          if [[ -z "$resource_group_name" ]]; then
            echo "Resource group name is missing. Set inputs.resourceGroupName or secret STATE_RG_NAME." >&2
            exit 1
          fi

          subscription_id=$(az account show --query id -o tsv)

          normalize_storage_account_name() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9'
          }

          build_generated_storage_account_name() {
            local prefix_value="$1"
            local subscription_value="$2"
            local resource_group_value="$3"

            normalized_prefix="$(printf '%s' "$prefix_value" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            if [[ -z "$normalized_prefix" ]]; then
              echo "Storage account prefix must contain at least one lowercase letter or digit." >&2
              exit 1
            fi

            hash_suffix="$(printf '%s' "${subscription_value}-${resource_group_value}" | sha256sum | cut -c1-10)"
            prefix_length=$((24 - ${#hash_suffix}))
            if (( prefix_length < 3 )); then
              echo "Storage account prefix leaves no room for a stable unique suffix." >&2
              exit 1
            fi

            printf '%s%s' "${normalized_prefix:0:prefix_length}" "$hash_suffix"
          }

          if az group exists --name "$resource_group_name" | grep -qi true; then
            existing_location=$(az group show --name "$resource_group_name" --query location -o tsv)

            if [[ -n "$requested_location" && "$requested_location" != "$existing_location" ]]; then
              echo "Requested location '$requested_location' does not match existing resource group '$resource_group_name' location '$existing_location'. Reuse the existing location or choose a different resource group." >&2
              exit 1
            fi

            location="$existing_location"
          else
            location="$requested_location"
          fi

          if [[ -z "$location" ]]; then
            echo "Location is missing. Set inputs.location or secret STATE_LOCATION when creating a new backend." >&2
            exit 1
          fi

          if [[ -n "$storage_account_name" ]]; then
            storage_account_name="$(normalize_storage_account_name "$storage_account_name")"
            if [[ -z "$storage_account_name" ]]; then
              echo "Storage account name must contain at least one lowercase letter or digit." >&2
              exit 1
            fi

            name_available=$(az storage account check-name --name "$storage_account_name" --query nameAvailable -o tsv)
            if [[ "$name_available" != "true" ]]; then
              echo "Requested storage account name '$storage_account_name' is already taken; falling back to a generated name." >&2
              storage_account_name=""
            fi
          fi

          if [[ -z "$storage_account_name" ]]; then
            mapfile -t existing_accounts < <(az storage account list \
              --resource-group "$resource_group_name" \
              --query "[].name" \
              -o tsv 2>/dev/null || true)

            if (( ${#existing_accounts[@]} == 1 )); then
              storage_account_name="${existing_accounts[0]}"
            elif (( ${#existing_accounts[@]} > 1 )); then
              echo "Multiple storage accounts already exist in resource group '$resource_group_name'. Set inputs.storageAccountName or secret STATE_SA_NAME to select the backend explicitly." >&2
              printf '%s\n' "${existing_accounts[@]}" >&2
              exit 1
            else
              generated_prefix_source="${storage_account_prefix:-$resource_group_name}"
              storage_account_name="$(build_generated_storage_account_name "$generated_prefix_source" "$subscription_id" "$resource_group_name")"
            fi
          fi

          if [[ ! "$storage_account_name" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "Storage account name '$storage_account_name' must be 3-24 lowercase letters or digits." >&2
            exit 1
          fi

          if [[ "$SELF_HOSTED_RUNNER_ENABLED" == "true" ]]; then
            echo "TF_VAR_self_hosted_runner_enabled=true" >> "$GITHUB_ENV"
            echo "TF_VAR_self_hosted_runner_image=$SELF_HOSTED_RUNNER_IMAGE" >> "$GITHUB_ENV"
            echo "TF_VAR_self_hosted_runner_label=$SELF_HOSTED_RUNNER_LABEL" >> "$GITHUB_ENV"
            echo "TF_VAR_self_hosted_runner_repository=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_self_hosted_runner_enabled=false" >> "$GITHUB_ENV"
          fi

          deployment_name="bootstrap-${GITHUB_RUN_ID}"

          az deployment sub create \
            --name "$deployment_name" \
            --location "$location" \
            --template-file "bootstrap.bicep" \
            --parameters resourceGroupName="$resource_group_name" \
                         storageAccountName="$storage_account_name" \
                         containerName="$CONTAINER_NAME" \
                         stateKey="$STATE_KEY"

          resource_group_name=$(az deployment sub show \
            --name "$deployment_name" \
            --query properties.outputs.resourceGroupName.value \
            -o tsv)

          storage_account_name=$(az deployment sub show \
            --name "$deployment_name" \
            --query properties.outputs.storageAccountName.value \
            -o tsv)

          container_name=$(az deployment sub show \
            --name "$deployment_name" \
            --query properties.outputs.containerName.value \
            -o tsv)

          state_key=$(az deployment sub show \
            --name "$deployment_name" \
            --query properties.outputs.stateKey.value \
            -o tsv)

          echo "resource_group_name=$resource_group_name" >> "$GITHUB_ENV"
          echo "storage_account_name=$storage_account_name" >> "$GITHUB_ENV"
          echo "container_name=$container_name" >> "$GITHUB_ENV"
          echo "state_key=$state_key" >> "$GITHUB_ENV"

          effective_public_network_access="$PUBLIC_NETWORK_ACCESS_ENABLED"
          if [[ "$SELF_HOSTED_RUNNER_ENABLED" != "true" && "$PUBLIC_NETWORK_ACCESS_ENABLED" == "false" ]]; then
            echo "PUBLIC_NETWORK_ACCESS_ENABLED=false requested on a GitHub-hosted runner. Keeping public access enabled for this run to avoid backend lockout; enforce full private-only mode on a self-hosted runner." >&2
            effective_public_network_access="true"
          fi

          echo "TF_VAR_location=$location" >> "$GITHUB_ENV"
          echo "TF_VAR_resource_group_name=$resource_group_name" >> "$GITHUB_ENV"
          echo "TF_VAR_storage_account_name=$storage_account_name" >> "$GITHUB_ENV"
          echo "TF_VAR_container_name=$container_name" >> "$GITHUB_ENV"
          echo "TF_VAR_tags={}" >> "$GITHUB_ENV"
          echo "TF_VAR_public_network_access_enabled=$effective_public_network_access" >> "$GITHUB_ENV"
          echo "TF_VAR_network_rules_enabled=$NETWORK_RULES_ENABLED" >> "$GITHUB_ENV"
          echo "TF_VAR_network_bypass=$NETWORK_BYPASS" >> "$GITHUB_ENV"
          echo "TF_VAR_allowed_subnet_ids=$ALLOWED_SUBNET_IDS" >> "$GITHUB_ENV"
          echo "TF_VAR_allowed_ip_rules=$ALLOWED_IP_RULES" >> "$GITHUB_ENV"
          echo "TF_VAR_private_endpoint_enabled=$PRIVATE_ENDPOINT_ENABLED" >> "$GITHUB_ENV"

          if [[ -n "$PRIVATE_ENDPOINT_SUBNET_ID" ]]; then
            echo "TF_VAR_private_endpoint_subnet_id=$PRIVATE_ENDPOINT_SUBNET_ID" >> "$GITHUB_ENV"
          fi

          echo "TF_VAR_private_dns_zone_name=$PRIVATE_DNS_ZONE_NAME" >> "$GITHUB_ENV"

          if [[ -n "$PRIVATE_DNS_ZONE_RESOURCE_GROUP_NAME" ]]; then
            echo "TF_VAR_private_dns_zone_resource_group_name=$PRIVATE_DNS_ZONE_RESOURCE_GROUP_NAME" >> "$GITHUB_ENV"
          fi

          if [[ -n "$PRIVATE_DNS_ZONE_VIRTUAL_NETWORK_ID" ]]; then
            echo "TF_VAR_private_dns_zone_virtual_network_id=$PRIVATE_DNS_ZONE_VIRTUAL_NETWORK_ID" >> "$GITHUB_ENV"
          fi

          echo "TF_VAR_blob_versioning_enabled=$BLOB_VERSIONING_ENABLED" >> "$GITHUB_ENV"
          echo "TF_VAR_change_feed_enabled=$CHANGE_FEED_ENABLED" >> "$GITHUB_ENV"
          echo "TF_VAR_last_access_time_enabled=$LAST_ACCESS_TIME_ENABLED" >> "$GITHUB_ENV"
          echo "TF_VAR_blob_delete_retention_days=$BLOB_DELETE_RETENTION_DAYS" >> "$GITHUB_ENV"
          echo "TF_VAR_container_delete_retention_days=$CONTAINER_DELETE_RETENTION_DAYS" >> "$GITHUB_ENV"

          if [[ "$CMK_ENABLED" == "true" ]]; then
            cmk_key_vault_id="$CMK_KEY_VAULT_ID"
            cmk_key_vault_name="${CMK_KEY_VAULT_NAME:-$CMK_KEY_VAULT_NAME_SECRET}"
            cmk_key_name="$CMK_KEY_NAME"
            client_id="${{ secrets.AZURE_CLIENT_ID }}"
            sp_object_id=$(az ad sp show --id "$client_id" --query id -o tsv)

            if [[ -z "$cmk_key_vault_id" ]]; then
              if [[ -n "$cmk_key_vault_name" ]]; then
                cmk_key_vault_id=$(az keyvault show --name "$cmk_key_vault_name" --query id -o tsv 2>/dev/null || true)
              fi

              if [[ -z "$cmk_key_vault_id" ]]; then
                mapfile -t discovered_key_vault_ids < <(az keyvault list \
                  --resource-group "$resource_group_name" \
                  --query "[].id" \
                  -o tsv 2>/dev/null || true)

                if (( ${#discovered_key_vault_ids[@]} == 1 )); then
                  cmk_key_vault_id="${discovered_key_vault_ids[0]}"
                elif (( ${#discovered_key_vault_ids[@]} > 1 )); then
                  echo "Multiple Key Vaults found in resource group '$resource_group_name'; provide cmkKeyVaultId or cmkKeyVaultName." >&2
                  printf '%s\n' "${discovered_key_vault_ids[@]}" >&2
                  exit 1
                fi
              fi

              if [[ -z "$cmk_key_vault_id" ]]; then
                if [[ -z "$cmk_key_vault_name" ]]; then
                  generated_suffix=$(printf '%s' "${subscription_id}-${resource_group_name}" | sha256sum | cut -c1-18)
                  cmk_key_vault_name="kv${generated_suffix}"
                fi

                name_available=$(az keyvault check-name --name "$cmk_key_vault_name" --query nameAvailable -o tsv)
                if [[ "$name_available" != "true" ]]; then
                  generated_suffix=$(printf '%s' "${subscription_id}-${resource_group_name}-${storage_account_name}" | sha256sum | cut -c1-18)
                  cmk_key_vault_name="kv${generated_suffix}"
                fi

                az keyvault create \
                  --name "$cmk_key_vault_name" \
                  --resource-group "$resource_group_name" \
                  --location "$location" \
                  --sku standard \
                  --enable-rbac-authorization true \
                  --retention-days 90 \
                  --only-show-errors > /dev/null

                cmk_key_vault_id=$(az keyvault show --name "$cmk_key_vault_name" --query id -o tsv)
                echo "Created Key Vault '$cmk_key_vault_name' for CMK."
              fi
            fi

            cmk_key_vault_name="${cmk_key_vault_id##*/}"

            purge_protection_enabled=$(az keyvault show --name "$cmk_key_vault_name" --query properties.enablePurgeProtection -o tsv)
            if [[ "$purge_protection_enabled" != "true" ]]; then
              echo "Enabling purge protection on Key Vault '$cmk_key_vault_name' for Storage CMK compatibility."
              az keyvault update \
                --name "$cmk_key_vault_name" \
                --enable-purge-protection true \
                --only-show-errors > /dev/null
            fi

            if ! az keyvault key show --vault-name "$cmk_key_vault_name" --name "$cmk_key_name" > /dev/null 2>&1; then
              set +e
              create_output=$(az keyvault key create \
                --vault-name "$cmk_key_vault_name" \
                --name "$cmk_key_name" \
                --kty RSA \
                --size 2048 \
                --only-show-errors 2>&1)
              create_exit_code=$?
              set -e

              if [[ $create_exit_code -ne 0 ]]; then
                if printf '%s' "$create_output" | grep -qi "ForbiddenByRbac\|Caller is not authorized"; then
                  vault_scope="$cmk_key_vault_id"

                  existing_crypto_assignment=$(az role assignment list \
                    --assignee-object-id "$sp_object_id" \
                    --role "Key Vault Crypto Officer" \
                    --scope "$vault_scope" \
                    --query "[0].id" \
                    -o tsv)

                  if [[ -z "$existing_crypto_assignment" ]]; then
                    az role assignment create \
                      --assignee-object-id "$sp_object_id" \
                      --role "Key Vault Crypto Officer" \
                      --scope "$vault_scope" \
                      --only-show-errors > /dev/null
                  fi

                  for attempt in {1..12}; do
                    set +e
                    retry_output=$(az keyvault key create \
                      --vault-name "$cmk_key_vault_name" \
                      --name "$cmk_key_name" \
                      --kty RSA \
                      --size 2048 \
                      --only-show-errors 2>&1)
                    retry_exit_code=$?
                    set -e

                    if [[ $retry_exit_code -eq 0 ]]; then
                      break
                    fi

                    if [[ $attempt -eq 12 ]]; then
                      printf '%s\n' "$retry_output" >&2
                      echo "Failed to create CMK key after assigning Key Vault Crypto Officer role. Check RBAC propagation and role assignment permissions." >&2
                      exit $retry_exit_code
                    fi

                    sleep 10
                  done
                else
                  printf '%s\n' "$create_output" >&2
                  exit $create_exit_code
                fi
              fi
            fi

            echo "TF_VAR_cmk_key_vault_id=$cmk_key_vault_id" >> "$GITHUB_ENV"
            echo "TF_VAR_cmk_key_name=$cmk_key_name" >> "$GITHUB_ENV"
          fi

          echo "TF_VAR_cmk_enabled=$CMK_ENABLED" >> "$GITHUB_ENV"

          if [[ -n "$CMK_KEY_VERSION" ]]; then
            echo "TF_VAR_cmk_key_version=$CMK_KEY_VERSION" >> "$GITHUB_ENV"
          fi

          if [[ -n "$CMK_USER_ASSIGNED_IDENTITY_ID" ]]; then
            echo "TF_VAR_cmk_user_assigned_identity_id=$CMK_USER_ASSIGNED_IDENTITY_ID" >> "$GITHUB_ENV"
          fi

          if [[ -n "$CMK_USER_ASSIGNED_IDENTITY_NAME" ]]; then
            echo "TF_VAR_cmk_user_assigned_identity_name=$CMK_USER_ASSIGNED_IDENTITY_NAME" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Grant Storage Blob Data Contributor role
        run: |
          set -euo pipefail

          subscription_id=$(az account show --query id -o tsv)
          client_id="${{ secrets.AZURE_CLIENT_ID }}"
          storage_scope="/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Storage/storageAccounts/${storage_account_name}"

          sp_object_id=$(az ad sp show --id "$client_id" --query id -o tsv)

          existing_assignment=$(az role assignment list \
            --assignee-object-id "$sp_object_id" \
            --role "Storage Blob Data Contributor" \
            --scope "$storage_scope" \
            --query "[0].id" \
            -o tsv)

          if [[ -n "$existing_assignment" ]]; then
            echo "Storage Blob Data Contributor already assigned for deployment identity on backend storage scope."
          else
            az role assignment create \
              --assignee-object-id "$sp_object_id" \
              --role "Storage Blob Data Contributor" \
              --scope "$storage_scope" \
              --only-show-errors > /dev/null
            echo "Assigned Storage Blob Data Contributor on backend storage scope."
          fi
        shell: bash

      - name: Temporarily allow runner IP on storage firewall
        if: ${{ inputs.networkRulesEnabled }}
        run: |
          set -euo pipefail

          runner_public_ip=$(curl -fsSL https://api.ipify.org)

          az storage account network-rule add \
            --resource-group "$resource_group_name" \
            --account-name "$storage_account_name" \
            --ip-address "$runner_public_ip" \
            --only-show-errors > /dev/null

          merged_allowed_ip_rules=$(jq -cn \
            --argjson configured "$ALLOWED_IP_RULES" \
            --arg runnerIp "$runner_public_ip" \
            '$configured + [$runnerIp] | unique')

          echo "runner_public_ip=$runner_public_ip" >> "$GITHUB_ENV"
          echo "TF_VAR_allowed_ip_rules=$merged_allowed_ip_rules" >> "$GITHUB_ENV"
          echo "Temporarily whitelisted runner IP $runner_public_ip on backend storage firewall."
        shell: bash

      - name: Initialize Terraform backend
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"

          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=$resource_group_name" \
            -backend-config="storage_account_name=$storage_account_name" \
            -backend-config="container_name=$container_name" \
            -backend-config="key=$state_key"
        shell: bash

      - name: Import Bicep-created resources
        run: |
          set -euo pipefail

          subscription_id=$(az account show --query id -o tsv)

          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state show -no-color "$address" > /dev/null 2>&1; then
              echo "$address already exists in Terraform state; skipping import."
              return
            fi

            terraform import -input=false "$address" "$resource_id"
          }

          import_if_missing azurerm_resource_group.tfstate "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}"
          import_if_missing azurerm_storage_account.tfstate "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Storage/storageAccounts/${storage_account_name}"
          import_if_missing azurerm_storage_container.tfstate "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Storage/storageAccounts/${storage_account_name}/blobServices/default/containers/${container_name}"

          import_if_exists() {
            local address="$1"
            local resource_id="$2"

            if az resource show --ids "$resource_id" > /dev/null 2>&1; then
              import_if_missing "$address" "$resource_id"
            fi
          }

          if [[ "$NETWORK_RULES_ENABLED" == "true" ]]; then
            import_if_missing azurerm_storage_account_network_rules.tfstate[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Storage/storageAccounts/${storage_account_name}"
          fi

          if [[ "$PRIVATE_ENDPOINT_ENABLED" == "true" ]]; then
            private_dns_rg="${PRIVATE_DNS_ZONE_RESOURCE_GROUP_NAME:-$resource_group_name}"

            import_if_exists azurerm_virtual_network.bootstrap[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Network/virtualNetworks/bootstrap-vnet"
            import_if_exists azurerm_subnet.self_hosted_runner[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Network/virtualNetworks/bootstrap-vnet/subnets/runner"
            import_if_exists azurerm_subnet.private_endpoint[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Network/virtualNetworks/bootstrap-vnet/subnets/private-endpoints"
            import_if_exists azurerm_private_dns_zone.blob[0] "/subscriptions/${subscription_id}/resourceGroups/${private_dns_rg}/providers/Microsoft.Network/privateDnsZones/${PRIVATE_DNS_ZONE_NAME}"
            import_if_exists azurerm_private_dns_zone_virtual_network_link.blob[0] "/subscriptions/${subscription_id}/resourceGroups/${private_dns_rg}/providers/Microsoft.Network/privateDnsZones/${PRIVATE_DNS_ZONE_NAME}/virtualNetworkLinks/${storage_account_name}-blob-link"
            import_if_exists azurerm_private_endpoint.blob[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.Network/privateEndpoints/${storage_account_name}-blob-pe"
          fi

          if [[ "$CMK_ENABLED" == "true" && -z "$CMK_USER_ASSIGNED_IDENTITY_ID" ]]; then
            import_if_exists azurerm_user_assigned_identity.cmk[0] "/subscriptions/${subscription_id}/resourceGroups/${resource_group_name}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${CMK_USER_ASSIGNED_IDENTITY_NAME}"
          fi
        shell: bash

      - name: Apply Terraform bootstrap
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"
          terraform apply -auto-approve -input=false
        shell: bash

      - name: Create GitHub App token
        if: ${{ inputs.selfHostedRunnerEnabled }}
        id: app_token
        uses: peter-evans/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Register self-hosted runner
        if: ${{ inputs.selfHostedRunnerEnabled }}
        env:
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_APP_TOKEN" ]]; then
            echo "GitHub App token is missing. Configure GH_APP_ID and GH_APP_PRIVATE_KEY secrets for the environment." >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"

          runner_job_name=$(terraform output -raw self_hosted_runner_job_name)
          runner_name="${runner_job_name}-ephemeral"

          az extension add --name containerapp --upgrade --only-show-errors

          registration_token=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" | jq -r .token)

          az containerapp job secret set \
            --name "$runner_job_name" \
            --resource-group "$resource_group_name" \
            --secrets runner-token="$registration_token" \
            --only-show-errors

          az containerapp job start \
            --name "$runner_job_name" \
            --resource-group "$resource_group_name" \
            --only-show-errors

          for attempt in {1..60}; do
            runner_status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_APP_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners" | jq -r --arg runner_name "$runner_name" '.runners[] | select(.name == $runner_name) | .status' | head -n1)

            if [[ "$runner_status" == "online" ]]; then
              echo "Ephemeral runner '$runner_name' is online."
              exit 0
            fi

            sleep 5
          done

          echo "Ephemeral runner '$runner_name' did not become online in time." >&2
          exit 1
        shell: bash

      - name: Remove temporary runner IP firewall allow
        if: ${{ always() && inputs.networkRulesEnabled }}
        run: |
          set -euo pipefail

          if [[ -z "${runner_public_ip:-}" ]]; then
            echo "No temporary runner IP was recorded; skipping firewall cleanup."
            exit 0
          fi

          az storage account network-rule remove \
            --resource-group "$resource_group_name" \
            --account-name "$storage_account_name" \
            --ip-address "$runner_public_ip" \
            --only-show-errors > /dev/null

          echo "Removed temporary runner IP $runner_public_ip from backend storage firewall."
        shell: bash

  verify-self-hosted-runner:
    name: Verify self-hosted runner
    if: ${{ inputs.selfHostedRunnerEnabled }}
    needs: bootstrap
    runs-on:
      - self-hosted
      - ${{ inputs.selfHostedRunnerLabel }}
    env:
      BOOTSTRAP_DIR: layers/bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Smoke test runner
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$BOOTSTRAP_DIR"
          hostname
          terraform validate

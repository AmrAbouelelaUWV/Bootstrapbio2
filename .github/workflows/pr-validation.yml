name: pr-validation

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: terraform-linters/setup-tflint@v4

      - name: Configure private module access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TERRAFORM_NETWORK_SSH_KEY }}" > ~/.ssh/network
          printf '%s\n' "${{ secrets.TERRAFORM_VMS_SSH_KEY }}" > ~/.ssh/vms
          printf '%s\n' "${{ secrets.TERRAFORM_BASTION_ACCESS_SSH_KEY }}" > ~/.ssh/bastion_access
          chmod 600 ~/.ssh/network ~/.ssh/vms ~/.ssh/bastion_access
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' \
            'Host github.com-jacquelinep777-network' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/network' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-vms' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/vms' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-bastion-access' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/bastion_access' \
            '  IdentitiesOnly yes' \
            >> ~/.ssh/config
          git config --global url."ssh://git@github.com-jacquelinep777-network/jacquelinep777/xx-azurerm-network.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-network.git"
          git config --global url."ssh://git@github.com-jacquelinep777-vms/jacquelinep777/xx-azurerm-vms.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-vms.git"
          git config --global url."ssh://git@github.com-jacquelinep777-bastion-access/jacquelinep777/xx-azurerm-stack-bastion-access.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-stack-bastion-access.git"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Test
        run: terraform test

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Policy
        run: conftest test tests/fixtures/tfplan.json --policy policies

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/terraform-docs

      - name: Render docs
        run: |
          terraform-docs markdown table --output-file README.md .
          git diff --exit-code README.md

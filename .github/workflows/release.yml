name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: terraform-linters/setup-tflint@v4

      - name: Configure private module access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TERRAFORM_NETWORK_SSH_KEY }}" > ~/.ssh/network
          printf '%s\n' "${{ secrets.TERRAFORM_VMS_SSH_KEY }}" > ~/.ssh/vms
          printf '%s\n' "${{ secrets.TERRAFORM_BASTION_ACCESS_SSH_KEY }}" > ~/.ssh/bastion_access
          chmod 600 ~/.ssh/network ~/.ssh/vms ~/.ssh/bastion_access
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' \
            'Host github.com-nluwv-network' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/network' \
            '  IdentitiesOnly yes' \
            'Host github.com-nluwv-vms' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/vms' \
            '  IdentitiesOnly yes' \
            'Host github.com-nluwv-bastion-access' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/bastion_access' \
            '  IdentitiesOnly yes' \
            >> ~/.ssh/config
          git config --global url."ssh://git@github.com-nluwv-network/nluwv/AZLABS-cnc-azurerm-network.git".insteadOf "ssh://git@github.com/nluwv/AZLABS-cnc-azurerm-network.git"
          git config --global url."ssh://git@github.com-nluwv-vms/nluwv/AZLABS-cnc-azurerm-vms.git".insteadOf "ssh://git@github.com/nluwv/AZLABS-cnc-azurerm-vms.git"
          git config --global url."ssh://git@github.com-nluwv-bastion-access/nluwv/AZLABS-cnc-azurerm-composition-bastion-access.git".insteadOf "ssh://git@github.com/nluwv/AZLABS-cnc-azurerm-composition-bastion-access.git"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Test
        run: terraform test

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Policy
        run: conftest test tests/fixtures/tfplan.json --policy policies

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/terraform-docs

      - name: Render docs
        run: |
          terraform-docs markdown table --output-file README.md .
          git diff --exit-code README.md

  release:
    needs: [terraform, policy, checkov, gitleaks, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release tooling
        run: |
          npm install --global \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

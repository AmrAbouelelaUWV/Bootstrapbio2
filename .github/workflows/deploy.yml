name: Bootstrap Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      github_environment:
        description: GitHub Environment containing Azure secrets/variables
        required: true
        default: Development
      workload:
        description: Bootstrap workload name
        required: true
        default: tfstate
      environment:
        description: Terraform environment
        required: true
        default: dev
      location:
        description: Azure region name
        required: true
        default: westeurope
      region_code:
        description: Short region code
        required: true
        default: we
      instance:
        description: Resource instance number
        required: true
        default: "01"
      biv:
        description: BIV tag value
        required: true
        default: "233"
      replication_type:
        description: Storage replication type
        required: true
        default: GRS
        type: choice
        options:
          - LRS
          - ZRS
          - GRS
          - GZRS
      storage_account_unique_suffix:
        description: Optional lowercase alphanumeric suffix for the storage account
        required: false
        default: ""
      key_vault_unique_suffix:
        description: Optional lowercase alphanumeric suffix for the Key Vault
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_AZUREAD: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Determine Azure auth mode
        id: auth_mode
        shell: bash
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.AZURE_TENANT_ID }}" ] && [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_vars" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "mode=spn_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No valid Azure auth configuration found." >&2
          echo "Set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID as variables or secrets, or set AZURE_CREDENTIALS for service principal secret auth." >&2
          exit 1

      - name: Azure login (OIDC via vars)
        if: steps.auth_mode.outputs.mode == 'oidc_vars'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC via secrets)
        if: steps.auth_mode.outputs.mode == 'oidc_secrets'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal secret)
        if: steps.auth_mode.outputs.mode == 'spn_secret'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve instance and naming
        id: naming
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action="${{ inputs.action }}"
          requested="${{ inputs.instance }}"

          if ! [[ "$requested" =~ ^[0-9]{2}$ ]]; then
            echo "Input instance must be exactly two digits (for example 01)." >&2
            exit 1
          fi

          selected=""
          rg_name="rg-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}-${requested}"

          if [ "$action" = "deploy" ]; then
            start=$((10#$requested))

            for i in $(seq "$start" 99); do
              candidate="$(printf '%02d' "$i")"
              rg_name="rg-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}-${candidate}"
              if [ "$(az group exists --name "$rg_name")" = "false" ]; then
                selected="$candidate"
                break
              fi
            done

            if [ -z "$selected" ]; then
              echo "No free instance found from $requested to 99." >&2
              exit 1
            fi
          else
            selected="$requested"

            if [ "$(az group exists --name "$rg_name")" != "true" ]; then
              echo "Destroy requested but resource group $rg_name was not found." >&2
              exit 1
            fi
          fi

          storage_suffix="${{ inputs.storage_account_unique_suffix }}"
          keyvault_suffix="${{ inputs.key_vault_unique_suffix }}"

          compact_workload="${{ inputs.workload }}"
          compact_workload="${compact_workload//-/}"

          if [ "$action" = "destroy" ]; then
            manifest_name="bootstrap-manifest-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}"
            manifest_id="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq ".artifacts[] | select(.name == \"$manifest_name\" and .expired == false) | .id" | head -n 1)"

            if [ -z "$manifest_id" ]; then
              echo "No non-expired deployment manifest found for $manifest_name." >&2
              exit 1
            fi

            gh api "repos/${{ github.repository }}/actions/artifacts/$manifest_id/zip" > manifest.zip
            unzip -o manifest.zip deployment-manifest.json >/dev/null
            rm -f manifest.zip

            storage_suffix="$(jq -r '.storage_suffix' deployment-manifest.json)"
            keyvault_suffix="$(jq -r '.keyvault_suffix' deployment-manifest.json)"
            selected="$(jq -r '.selected_instance' deployment-manifest.json)"

            if [ -z "$storage_suffix" ] || [ "$storage_suffix" = "null" ] || [ -z "$keyvault_suffix" ] || [ "$keyvault_suffix" = "null" ]; then
              echo "Deployment manifest did not contain the required suffixes for destroy." >&2
              exit 1
            fi

            state_artifact_name="$(jq -r '.state_artifact_name' deployment-manifest.json)"
            backend_storage_account_name="$(jq -r '.backend_storage_account_name' deployment-manifest.json)"
            backend_container_name="$(jq -r '.backend_container_name' deployment-manifest.json)"
            rg_name="$(jq -r '.resource_group_name' deployment-manifest.json)"

            rm -f deployment-manifest.json
          else
            if [ -z "$storage_suffix" ]; then
              storage_suffix="$(printf '%06d' "$GITHUB_RUN_NUMBER" | tail -c 7)"
            fi

            if [ -z "$keyvault_suffix" ]; then
              keyvault_suffix="$(printf '%03d' "$GITHUB_RUN_NUMBER" | tail -c 4)"
            fi

            state_artifact_name="bootstrap-state-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}-${selected}-${storage_suffix}-${keyvault_suffix}"
            backend_storage_account_name="sa${compact_workload}${{ inputs.environment }}${{ inputs.region_code }}${selected}${storage_suffix}"
            backend_container_name="${{ inputs.workload }}-${{ inputs.environment }}"

              jq -n \
                --arg action "$action" \
                --arg workload "${{ inputs.workload }}" \
                --arg environment "${{ inputs.environment }}" \
                --arg region_code "${{ inputs.region_code }}" \
                --arg requested_instance "$requested" \
                --arg selected_instance "$selected" \
                --arg resource_group_name "$rg_name" \
                --arg storage_suffix "$storage_suffix" \
                --arg keyvault_suffix "$keyvault_suffix" \
                --arg state_artifact_name "$state_artifact_name" \
                --arg backend_storage_account_name "$backend_storage_account_name" \
                --arg backend_container_name "$backend_container_name" \
                '{
                  action: $action,
                  workload: $workload,
                  environment: $environment,
                  region_code: $region_code,
                  requested_instance: $requested_instance,
                  selected_instance: $selected_instance,
                  resource_group_name: $resource_group_name,
                  storage_suffix: $storage_suffix,
                  keyvault_suffix: $keyvault_suffix,
                  state_artifact_name: $state_artifact_name,
                  backend_storage_account_name: $backend_storage_account_name,
                  backend_container_name: $backend_container_name
                }' > deployment-manifest.json
          fi

          echo "instance=$selected" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$rg_name" >> "$GITHUB_OUTPUT"
          echo "storage_suffix=$storage_suffix" >> "$GITHUB_OUTPUT"
          echo "keyvault_suffix=$keyvault_suffix" >> "$GITHUB_OUTPUT"
          echo "state_artifact_name=$state_artifact_name" >> "$GITHUB_OUTPUT"
          echo "backend_storage_account_name=$backend_storage_account_name" >> "$GITHUB_OUTPUT"
          echo "backend_container_name=$backend_container_name" >> "$GITHUB_OUTPUT"

          {
            echo "### Selected deployment values"
            echo "- Action: $action"
            echo "- Requested instance: $requested"
            echo "- Selected instance: $selected"
            echo "- Resource group: $rg_name"
            echo "- Storage suffix: $storage_suffix"
            echo "- Key Vault suffix: $keyvault_suffix"
            echo "- State artifact: $state_artifact_name"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$action" = "deploy" ] && [ "$selected" != "$requested" ]; then
            echo "Requested instance $requested already in use. Using $selected instead."
          elif [ "$action" = "deploy" ]; then
            echo "Using requested instance $requested."
          fi

      - name: Terraform init (local state)
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        if: inputs.action == 'deploy'
        run: terraform test

      - name: Terraform plan
        if: inputs.action == 'deploy'
        run: |
          terraform plan -input=false -out=tfplan \
            -var="workload=${{ inputs.workload }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="location=${{ inputs.location }}" \
            -var="region_code=${{ inputs.region_code }}" \
            -var="instance=${{ steps.naming.outputs.instance }}" \
            -var="biv=${{ inputs.biv }}" \
            -var="replication_type=${{ inputs.replication_type }}" \
            -var="storage_account_unique_suffix=${{ steps.naming.outputs.storage_suffix }}" \
            -var="key_vault_unique_suffix=${{ steps.naming.outputs.keyvault_suffix }}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${{ github.event.repository.name }}"

      - name: Terraform apply
        if: inputs.action == 'deploy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform state artifact
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.state_artifact_name }}
          path: terraform.tfstate
          if-no-files-found: error
          retention-days: 30

      - name: Upload deployment manifest
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-manifest-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}
          path: deployment-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Download Terraform state artifact
        if: inputs.action == 'destroy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_artifact_name="${{ steps.naming.outputs.state_artifact_name }}"
          artifact_id="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq ".artifacts[] | select(.name == \"$state_artifact_name\" and .expired == false) | .id" | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "No non-expired state artifact found for $state_artifact_name." >&2
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > state.zip
          unzip -o state.zip
          rm -f state.zip deployment-manifest.json

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="workload=${{ inputs.workload }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="location=${{ inputs.location }}" \
            -var="region_code=${{ inputs.region_code }}" \
            -var="instance=${{ steps.naming.outputs.instance }}" \
            -var="biv=${{ inputs.biv }}" \
            -var="replication_type=${{ inputs.replication_type }}" \
            -var="storage_account_unique_suffix=${{ steps.naming.outputs.storage_suffix }}" \
            -var="key_vault_unique_suffix=${{ steps.naming.outputs.keyvault_suffix }}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${{ github.event.repository.name }}"
name: Jumphost Test Stack Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - test
          - destroy
      github_environment:
        description: GitHub Environment containing Azure secrets/variables
        required: true
        default: Development
      terraform_environment:
        description: Terraform environment (selects environments/<env>.tfvars.json)
        required: true
        type: choice
        default: o
        options:
          - o
          - t
          - a
          - p
      instance:
        description: Resource instance number
        required: true
        default: "01"
      biv:
        description: BIV tag value
        required: true
        default: "233"
      linux_admin_ssh_public_key:
        description: SSH public key for Linux VM (required when enable_linux_vm is true)
        required: false
        default: ""
      windows_admin_password:
        description: Windows admin password for logical VM key windows (optional, merged into admin_passwords)
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    defaults:
      run:
        working-directory: stacks/composition-jumphost-test
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_AZUREAD: true
      LINUX_ADMIN_SSH_PUBLIC_KEY_SECRET: ${{ secrets.JUMPHOST_LINUX_ADMIN_SSH_PUBLIC_KEY }}
      WINDOWS_ADMIN_PASSWORD_SECRET: ${{ secrets.JUMPHOST_WINDOWS_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Determine Azure auth mode
        id: auth_mode
        shell: bash
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.AZURE_TENANT_ID }}" ] && [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_vars" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "mode=spn_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No valid Azure auth configuration found." >&2
          exit 1

      - name: Azure login (OIDC via vars)
        if: steps.auth_mode.outputs.mode == 'oidc_vars'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC via secrets)
        if: steps.auth_mode.outputs.mode == 'oidc_secrets'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal secret)
        if: steps.auth_mode.outputs.mode == 'spn_secret'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Validate VM credential inputs
        id: vm_creds
        shell: bash
        run: |
          tfvars_file="environments/${{ inputs.terraform_environment }}.tfvars.json"
          if [ ! -f "$tfvars_file" ]; then
            echo "Expected tfvars file not found: $tfvars_file" >&2
            exit 1
          fi

          linux_enabled="$(jq -r '.enable_linux_vm // false' "$tfvars_file")"
          windows_enabled="$(jq -r '.enable_windows_vm // false' "$tfvars_file")"

          linux_key='${{ inputs.linux_admin_ssh_public_key }}'
          if [ -z "$linux_key" ]; then
            linux_key="$LINUX_ADMIN_SSH_PUBLIC_KEY_SECRET"
          fi

          windows_password='${{ inputs.windows_admin_password }}'
          if [ -z "$windows_password" ]; then
            windows_password="$WINDOWS_ADMIN_PASSWORD_SECRET"
          fi

          windows_password_from_file="$(jq -r '.admin_passwords.windows // ""' "$tfvars_file")"

          if [ "$linux_enabled" = "true" ] && [ -z "$linux_key" ]; then
            echo "Provide linux_admin_ssh_public_key input or set JUMPHOST_LINUX_ADMIN_SSH_PUBLIC_KEY secret when enable_linux_vm=true." >&2
            exit 1
          fi

          if [ "$windows_enabled" = "true" ] && [ -z "$windows_password" ] && [ -z "$windows_password_from_file" ]; then
            echo "Provide windows_admin_password input or set JUMPHOST_WINDOWS_ADMIN_PASSWORD secret when enable_windows_vm=true." >&2
            exit 1
          fi

          echo "tfvars_file=$tfvars_file" >> "$GITHUB_OUTPUT"
          echo "linux_enabled=$linux_enabled" >> "$GITHUB_OUTPUT"
          echo "windows_enabled=$windows_enabled" >> "$GITHUB_OUTPUT"

          echo "linux_key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$linux_key" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "windows_password<<EOF" >> "$GITHUB_OUTPUT"
          echo "$windows_password" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Resolve instance and state artifact name
        id: state
        shell: bash
        run: |
          requested="${{ inputs.instance }}"
          if ! [[ "$requested" =~ ^[0-9]{2}$ ]]; then
            echo "instance must be exactly two digits, for example 01." >&2
            exit 1
          fi

          tfvars_file="${{ steps.vm_creds.outputs.tfvars_file }}"
          workload="$(jq -r '.workload' "$tfvars_file")"
          region_code="$(jq -r '.region_code' "$tfvars_file")"
          environment="${{ inputs.terraform_environment }}"
          action="${{ inputs.action }}"
          selected="$requested"

          if [ "$action" = "deploy" ]; then
            start=$((10#$requested))

            for i in $(seq "$start" 99); do
              candidate="$(printf '%02d' "$i")"
              rg_name="rg-${workload}-${environment}-${region_code}-${candidate}"
              if [ "$(az group exists --name "$rg_name")" = "false" ]; then
                selected="$candidate"
                break
              fi
            done

            if [ -z "$selected" ]; then
              echo "No free instance found between $requested and 99." >&2
              exit 1
            fi
          fi

          state_name="jumphost-test-state-${environment}-${selected}"
          rg_name="rg-${workload}-${environment}-${region_code}-${selected}"

          echo "selected_instance=$selected" >> "$GITHUB_OUTPUT"
          echo "name=$state_name" >> "$GITHUB_OUTPUT"

          {
            echo "### Instance selection"
            echo "- Action: $action"
            echo "- Requested instance: $requested"
            echo "- Selected instance: $selected"
            echo "- Resource group name: $rg_name"
            echo "- State artifact name: $state_name"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$action" = "deploy" ] && [ "$requested" != "$selected" ]; then
            echo "Requested instance $requested already exists; using $selected."
          fi

      - name: Build runtime tfvars
        shell: bash
        run: |
          tfvars_file="${{ steps.vm_creds.outputs.tfvars_file }}"
          effective_admin_passwords="$(jq -c '.admin_passwords // {}' "$tfvars_file")"
          if [ -n "${{ steps.vm_creds.outputs.windows_password }}" ]; then
            effective_admin_passwords="$(jq -cn --argjson base "$effective_admin_passwords" --arg pwd '${{ steps.vm_creds.outputs.windows_password }}' '$base + {windows: $pwd}')"
          fi

          jq -n \
            --arg environment "${{ inputs.terraform_environment }}" \
            --arg instance "${{ steps.state.outputs.selected_instance }}" \
            --arg biv "${{ inputs.biv }}" \
            --arg linux_admin_ssh_public_key "${{ steps.vm_creds.outputs.linux_key }}" \
            --argjson admin_passwords "$effective_admin_passwords" \
            '{
              environment: $environment,
              instance: $instance,
              biv: $biv,
              admin_passwords: $admin_passwords,
              linux_vm: (if ($linux_admin_ssh_public_key | length) > 0 then { admin_ssh_public_key: $linux_admin_ssh_public_key } else {} end)
            }' > runtime.auto.tfvars.json

      - name: Terraform test
        if: inputs.action == 'test'
        run: terraform test -var-file="${{ steps.vm_creds.outputs.tfvars_file }}" -var-file=runtime.auto.tfvars.json

      - name: Terraform plan
        if: inputs.action == 'deploy'
        run: terraform plan -input=false -out=tfplan -var-file="${{ steps.vm_creds.outputs.tfvars_file }}" -var-file=runtime.auto.tfvars.json

      - name: Terraform apply
        if: inputs.action == 'deploy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform state artifact
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.state.outputs.name }}
          path: stacks/composition-jumphost-test/terraform.tfstate
          if-no-files-found: error
          retention-days: 30

      - name: Download Terraform state artifact
        if: inputs.action == 'destroy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_artifact_name="${{ steps.state.outputs.name }}"
          artifact_id="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq ".artifacts[] | select(.name == \"$state_artifact_name\" and .expired == false) | .id" | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "No non-expired state artifact found for $state_artifact_name." >&2
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > state.zip
          unzip -o state.zip
          rm -f state.zip

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -var-file="${{ steps.vm_creds.outputs.tfvars_file }}" -var-file=runtime.auto.tfvars.json

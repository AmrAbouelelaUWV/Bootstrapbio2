name: Jumphost Stack Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      github_environment:
        description: GitHub Environment containing Azure secrets/variables
        required: true
        default: Development
      workload:
        description: Workload name
        required: true
        default: management
      environment:
        description: Terraform environment
        required: true
        default: dev
      location:
        description: Azure region name
        required: true
        default: westeurope
      region_code:
        description: Short region code
        required: true
        default: we
      instance:
        description: Resource instance number
        required: true
        default: "01"
      biv:
        description: BIV tag value
        required: true
        default: "233"
      address_space_json:
        description: JSON list for VNet address space
        required: true
        default: '["10.10.0.0/16"]'
      management_subnet_prefix:
        description: Management subnet CIDR
        required: true
        default: 10.10.1.0/24
      bastion_address_space_json:
        description: JSON list for Bastion VNet address space
        required: true
        default: '["10.90.0.0/24"]'
      bastion_subnet_prefix:
        description: AzureBastionSubnet CIDR
        required: true
        default: 10.90.0.0/26
      admin_login_principal_ids_json:
        description: JSON map of VM admin login principal IDs
        required: false
        default: '{}'
      user_login_principal_ids_json:
        description: JSON map of VM user login principal IDs
        required: false
        default: '{}'
      admin_passwords_json:
        description: JSON map of Windows admin passwords
        required: false
        default: '{}'
      linux_admin_ssh_public_key:
        description: SSH public key for Linux VM (required when enable_linux_vm is true)
        required: false
        default: ""
      windows_admin_password:
        description: Windows admin password for logical VM key windows (optional, merged into admin_passwords)
        required: false
        default: ""
      enable_linux_vm:
        description: Deploy Linux management VM
        required: true
        default: false
        type: boolean
      enable_windows_vm:
        description: Deploy Windows management VM
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    defaults:
      run:
        working-directory: stacks/composition-jumphost
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_AZUREAD: true
      LINUX_ADMIN_SSH_PUBLIC_KEY_SECRET: ${{ secrets.JUMPHOST_LINUX_ADMIN_SSH_PUBLIC_KEY }}
      WINDOWS_ADMIN_PASSWORD_SECRET: ${{ secrets.JUMPHOST_WINDOWS_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Determine Azure auth mode
        id: auth_mode
        shell: bash
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.AZURE_TENANT_ID }}" ] && [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_vars" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "mode=oidc_secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "mode=spn_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No valid Azure auth configuration found." >&2
          exit 1

      - name: Azure login (OIDC via vars)
        if: steps.auth_mode.outputs.mode == 'oidc_vars'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC via secrets)
        if: steps.auth_mode.outputs.mode == 'oidc_secrets'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal secret)
        if: steps.auth_mode.outputs.mode == 'spn_secret'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve state artifact name
        id: state
        shell: bash
        run: |
          echo "name=jumphost-state-${{ inputs.workload }}-${{ inputs.environment }}-${{ inputs.region_code }}-${{ inputs.instance }}" >> "$GITHUB_OUTPUT"

      - name: Download Terraform state artifact
        if: inputs.action == 'destroy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_artifact_name="${{ steps.state.outputs.name }}"
          artifact_id="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq ".artifacts[] | select(.name == \"$state_artifact_name\" and .expired == false) | .id" | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "No non-expired state artifact found for $state_artifact_name." >&2
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > state.zip
          unzip -o state.zip
          rm -f state.zip

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Validate VM credential inputs
        id: vm_creds
        shell: bash
        run: |
          linux_key='${{ inputs.linux_admin_ssh_public_key }}'
          if [ -z "$linux_key" ]; then
            linux_key="$LINUX_ADMIN_SSH_PUBLIC_KEY_SECRET"
          fi

          windows_password='${{ inputs.windows_admin_password }}'
          if [ -z "$windows_password" ]; then
            windows_password="$WINDOWS_ADMIN_PASSWORD_SECRET"
          fi

          if [ "${{ inputs.enable_linux_vm }}" = "true" ] && [ -z "$linux_key" ]; then
            echo "Provide linux_admin_ssh_public_key input or set JUMPHOST_LINUX_ADMIN_SSH_PUBLIC_KEY secret when enable_linux_vm=true." >&2
            exit 1
          fi

          if [ "${{ inputs.enable_windows_vm }}" = "true" ] && [ -z "$windows_password" ] && [ "${{ inputs.admin_passwords_json }}" = "{}" ]; then
            echo "Provide windows_admin_password input, admin_passwords_json, or set JUMPHOST_WINDOWS_ADMIN_PASSWORD secret when enable_windows_vm=true." >&2
            exit 1
          fi

          echo "linux_key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$linux_key" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "windows_password<<EOF" >> "$GITHUB_OUTPUT"
          echo "$windows_password" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build runtime tfvars
        shell: bash
        run: |
          if ! echo '${{ inputs.address_space_json }}' | jq -e type >/dev/null 2>&1; then
            echo "address_space_json must be valid JSON." >&2
            exit 1
          fi

          if ! echo '${{ inputs.bastion_address_space_json }}' | jq -e type >/dev/null 2>&1; then
            echo "bastion_address_space_json must be valid JSON." >&2
            exit 1
          fi

          if ! echo '${{ inputs.admin_login_principal_ids_json }}' | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "admin_login_principal_ids_json must be a JSON object." >&2
            exit 1
          fi

          if ! echo '${{ inputs.user_login_principal_ids_json }}' | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "user_login_principal_ids_json must be a JSON object." >&2
            exit 1
          fi

          if ! echo '${{ inputs.admin_passwords_json }}' | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "admin_passwords_json must be a JSON object." >&2
            exit 1
          fi

          effective_admin_passwords='${{ inputs.admin_passwords_json }}'
          if [ -n "${{ steps.vm_creds.outputs.windows_password }}" ]; then
            effective_admin_passwords="$(jq -cn --argjson base '${{ inputs.admin_passwords_json }}' --arg pwd '${{ steps.vm_creds.outputs.windows_password }}' '$base + {windows: $pwd}')"
          fi

          jq -n \
            --arg workload "${{ inputs.workload }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg location "${{ inputs.location }}" \
            --arg region_code "${{ inputs.region_code }}" \
            --arg instance "${{ inputs.instance }}" \
            --arg biv "${{ inputs.biv }}" \
            --arg management_subnet_prefix "${{ inputs.management_subnet_prefix }}" \
            --arg bastion_subnet_prefix "${{ inputs.bastion_subnet_prefix }}" \
            --arg linux_admin_ssh_public_key "${{ steps.vm_creds.outputs.linux_key }}" \
            --argjson address_space '${{ inputs.address_space_json }}' \
            --argjson bastion_address_space '${{ inputs.bastion_address_space_json }}' \
            --argjson admin_login_principal_ids '${{ inputs.admin_login_principal_ids_json }}' \
            --argjson user_login_principal_ids '${{ inputs.user_login_principal_ids_json }}' \
            --argjson admin_passwords "$effective_admin_passwords" \
            --argjson enable_linux_vm ${{ inputs.enable_linux_vm }} \
            --argjson enable_windows_vm ${{ inputs.enable_windows_vm }} \
            '{
              workload: $workload,
              environment: $environment,
              location: $location,
              region_code: $region_code,
              instance: $instance,
              biv: $biv,
              address_space: $address_space,
              management_subnet_prefix: $management_subnet_prefix,
              bastion_address_space: $bastion_address_space,
              bastion_subnet_prefix: $bastion_subnet_prefix,
              admin_login_principal_ids: $admin_login_principal_ids,
              user_login_principal_ids: $user_login_principal_ids,
              admin_passwords: $admin_passwords,
              enable_linux_vm: $enable_linux_vm,
              enable_windows_vm: $enable_windows_vm,
              linux_vm: (if ($linux_admin_ssh_public_key | length) > 0 then { admin_ssh_public_key: $linux_admin_ssh_public_key } else {} end)
            }' > runtime.auto.tfvars.json

      - name: Terraform plan
        if: inputs.action == 'deploy'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'deploy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform state artifact
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.state.outputs.name }}
          path: stacks/composition-jumphost/terraform.tfstate
          if-no-files-found: error
          retention-days: 30

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
